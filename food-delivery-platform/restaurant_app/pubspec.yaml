name: restaurant_app
description: "Go Fresh - Restaurant Partner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  socket_io_client: ^2.0.3+1
