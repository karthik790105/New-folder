name: rider_app
description: "Go Fresh - Delivery Partner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  # Location & Maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
